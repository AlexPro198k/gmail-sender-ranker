<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#16181d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/; style-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; connect-src https://gmail.googleapis.com https://accounts.google.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Sender Ranker</title>
  <link rel="stylesheet" href="app.css?v=5">
</head>
<body>
  <header>
    <h1>Sender Ranker</h1>
    <button id="sign-out" hidden>Sign out</button>
  </header>
  <main>
    <section id="signin">
      <p>Sign in with Google to rank your Inbox senders and manage them.</p>
      <button id="sign-in" class="primary">Sign in with Google</button>
    </section>
    <section id="app" hidden>
      <div class="toolbar">
        <button id="scan" class="primary">Scan Inbox</button>
        <button id="empty-trash" class="danger">Empty Trash</button>
        <button id="empty-spam" class="danger">Delete Spam</button>
        <button id="delete-inbox" class="danger">Delete Inbox</button>
      </div>
      <p id="status" role="status"></p>
      <input id="filter" type="search" placeholder="Filter senders" hidden>
      <ul id="list"></ul>
    </section>
  </main>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js?v=5"></script>
</body>
</html>

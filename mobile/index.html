<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#16181d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/; style-src 'self' https://accounts.google.com/gsi/ 'unsafe-hashes' 'sha256-RU4sU0AaS8IBGZx8XrGt/pa9A5SLA3dQszGeqT5L3Kw='; frame-src https://accounts.google.com/gsi/; connect-src https://gmail.googleapis.com https://accounts.google.com https://graph.microsoft.com https://login.microsoftonline.com https://api.login.yahoo.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Email Organizer</title>
  <link rel="stylesheet" href="app.css?v=10">
</head>
<body>
  <header>
    <h1>Email Organizer</h1>
    <div id="header-signin">
      <button id="sign-in" class="primary">Google</button>
      <button id="sign-in-ms" hidden>Microsoft</button>
      <button id="sign-in-yahoo" hidden>Yahoo</button>
    </div>
    <button id="theme-toggle" aria-label="Switch theme">HOLONET</button>
    <button id="sign-out" hidden>Sign out</button>
  </header>
  <main>
    <section id="signin">
      <p>Sign in above to rank and manage your inbox senders.</p>
    </section>
    <section id="app" hidden>
      <div class="toolbar">
        <button id="scan" class="primary">Scan Inbox</button>
        <button id="manage-rules">Manage Rules</button>
        <button id="auto-rule">✦ Auto Rule</button>
        <div class="toolbar-divider">Danger Zone</div>
        <button id="empty-trash" class="danger">Empty Trash</button>
        <button id="empty-spam" class="danger">Delete Spam</button>
        <button id="delete-inbox" class="danger">Delete Old Inbox</button>
      </div>
      <p id="status" role="status"></p>
      <input id="filter" type="search" placeholder="Filter senders" hidden>
      <ul id="list"></ul>
    </section>
  </main>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js?v=10"></script>
</body>
</html>
